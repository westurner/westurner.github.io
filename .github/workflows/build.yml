name: "Build a tinkerer sphinx static HTML site"
on:
  push:
    branches:
      - source

# pull_request:

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v1
    - uses: actions/setup-python@v7.1.0
      with:
        python-version: "3.13"
    - name: Install dependencies and build docs
      env:
        # Keep editable installs separate from the uninitialized src/tinkerer submodule.
        PIP_SRC: ${{ runner.temp }}/pip-src
      run: make install build
